[project]
name = "adjoint-helmholtz"
version = "0.1.0"
description = "2D FDFD Helmholtz solver with hand-derived adjoint gradients"
readme = "README.md"
authors = [
    { name = "electronics10", email = "73749204+electronics10@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jax>=0.12.0.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
